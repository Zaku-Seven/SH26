<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Puzzle 1: Wake Jib</title>
  <style>
    :root{color-scheme:dark;font-family:monospace}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171b24;color:#f8f3d2}
    main{text-align:center}.shell{border:8px solid #50566b;border-radius:14px;background:#272c39;padding:10px;box-shadow:0 16px 50px #0008}
    canvas{display:block;width:min(90vw,720px);aspect-ratio:3/2;image-rendering:pixelated;background:#000}
    .help{margin-top:10px;font-size:14px;color:#d7ddb0}.help b{color:#fff2a4}
  </style>
</head>
<body>
<main>
  <div class="shell"><canvas id="game" width="240" height="160"></canvas></div>
  <div class="help"><b>Move:</b> arrows/WASD &nbsp; <b>Interact:</b> Z/Enter/Space &nbsp; <b>Reset:</b> R</div>
</main>
<script>
const c=document.querySelector('#game'),g=c.getContext('2d'); g.imageSmoothingEnabled=false;
const outside=new Image(),room=new Image(); outside.src='outside.png'; room.src='room.png';
const keys=new Set(); let area='outside', px=77,py=110, face='up', drink=false, awake=false, done=false, msg='Find Jib in the red house.';
const held=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase(); keys.add(k); if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k))e.preventDefault(); if(k==='r')reset();});
addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase()); held.delete(e.key.toLowerCase());});
function reset(){area='outside';px=77;py=110;face='up';drink=false;awake=false;done=false;msg='Find Jib in the red house.'}
function press(...names){for(const n of names)if(keys.has(n)&&!held.has(n)){held.add(n);return true}return false}
function near(x,y,w,h,pad=8){return px>x-pad&&px<x+w+pad&&py>y-pad&&py<y+h+pad}
function blocked(nx,ny){
  if(area==='outside') return nx<8||nx>232||ny<24||ny>148;
  if(nx<10||nx>230||ny<18||ny>150)return true;
  const boxes=[[16,48,34,52],[16,110,46,32],[174,50,48,46],[210,88,18,34],[16,14,148,26],[194,14,30,26]];
  return boxes.some(([x,y,w,h])=>nx>x-5&&nx<x+w+5&&ny>y-8&&ny<y+h+5);
}
function interact(){
  if(area==='outside'){
    if(near(66,65,24,28,12)){area='room';px=120;py=140;face='up';msg=awake?'Jib is awake. Head back outside.':'Jib is asleep on the couch.'}
    else msg='The red house is where Jib lives.';
    return;
  }
  if(near(16,48,34,52,11)){
    if(drink||awake)msg='The fridge is empty.';
    else{drink=true;msg='You found an ENERGY DRINK! Bring it to Jib.'}
  }else if(near(174,50,48,46,13)){
    if(awake)msg='JIB: Go find Nick at the Rec Center!';
    else if(!drink)msg="Jib won't wake up. Maybe check the fridge.";
    else{drink=false;awake=true;msg='JIB woke up! He tells you to find Nick at the Rec Center.'}
  }else if(py>137&&px>103&&px<137){area='outside';px=77;py=104;face='down';if(awake){done=true;msg='PUZZLE 1 COMPLETE — Find Nick at the Rec Center.'}else msg='You still need to wake Jib.'}
  else msg='Nothing interesting here.';
}
function update(){
  let dx=0,dy=0;if(keys.has('arrowleft')||keys.has('a'))dx=-1;else if(keys.has('arrowright')||keys.has('d'))dx=1;else if(keys.has('arrowup')||keys.has('w'))dy=-1;else if(keys.has('arrowdown')||keys.has('s'))dy=1;
  if(dx||dy){face=dx<0?'left':dx>0?'right':dy<0?'up':'down';let nx=px+dx,ny=py+dy;if(!blocked(nx,ny)){px=nx;py=ny}}
  if(press('z','enter',' '))interact();
}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function drawPerson(x,y,curly=false,sleep=false){
  g.save();g.translate(Math.round(x),Math.round(y));
  if(sleep){
    rect(-9,-7,18,13,'#29394d');rect(-8,-6,16,11,'#a76d43');
    rect(-9,-9,4,4,'#221b1a');rect(-5,-10,5,4,'#221b1a');rect(0,-10,5,4,'#221b1a');rect(5,-9,4,4,'#221b1a');
    rect(-7,-4,5,3,'#28323b');rect(2,-4,5,3,'#28323b');rect(-5,-3,2,1,'#d7e2d4');rect(4,-3,2,1,'#d7e2d4');rect(-2,-3,4,1,'#28323b');
  }else{
    rect(-5,7,4,6,'#253442');rect(2,7,4,6,'#253442');rect(-7,-1,14,9,'#344f5d');rect(-8,1,3,7,'#a76d43');rect(6,1,3,7,'#a76d43');
    rect(-7,-12,14,12,'#b87b4d');rect(-7,-12,14,4,curly?'#221b1a':'#f4f1dd');
    if(curly){for(const [cx,cy] of [[-7,-13],[-3,-15],[1,-15],[5,-13]])rect(cx,cy,5,5,'#221b1a');rect(-6,-8,5,3,'#28323b');rect(2,-8,5,3,'#28323b');rect(-4,-7,2,1,'#d7e2d4');rect(3,-7,2,1,'#d7e2d4');rect(-1,-7,3,1,'#28323b');}
    else{rect(-8,-14,16,5,'#eef0dc');rect(-4,-10,8,3,'#3a9b58')}
  }
  g.restore();
}
function box(text){
  rect(5,124,230,31,'#263243');rect(7,126,226,27,'#f5efd1');rect(9,128,222,23,'#56636b');rect(11,130,218,19,'#f7f1d6');
  g.fillStyle='#263243';g.font='7px monospace';let words=text.split(' '),line='',y=137;
  for(const w of words){let test=line+w+' ';if(g.measureText(test).width>208){g.fillText(line,15,y);line=w+' ';y+=8}else line=test}g.fillText(line,15,y);
}
function draw(){
  g.clearRect(0,0,240,160);g.drawImage(area==='outside'?outside:room,0,0,240,160);
  if(area==='room'&&!awake)drawPerson(195,74,true,true);
  if(area==='room'&&awake)drawPerson(160,88,true,false);
  drawPerson(px,py,false,false);
  rect(4,4,100,12,'#263243');g.fillStyle='#f7f1d6';g.font='7px monospace';g.fillText(done?'QUEST: FIND NICK':drink?'ITEM: ENERGY DRINK':area==='room'?'PUZZLE 1: WAKE JIB':'RED HOUSE',8,12);
  box(msg);requestAnimationFrame(loop);
}
function loop(){update();draw()}
Promise.all([new Promise(r=>outside.onload=r),new Promise(r=>room.onload=r)]).then(loop);
</script>
</body>
</html>
